name: Build Qatar4u Mobile candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check candidate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          mkdir -p candidate
          cp app/build/outputs/apk/debug/app-debug.apk candidate/Qatar4u-Mobile-1.1.0-preview.apk
          cd candidate
          sha256sum Qatar4u-Mobile-1.1.0-preview.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Qatar4u-Mobile-preview
          path: candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qatar4u-Mobile-checks
          path: |
            app/build/reports/
            app/build/test-results/
